<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | CyberGuard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #071018;
            color: #e8f0f5;
            font-family: Arial, sans-serif;
        }

        .forgot-container {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: #0d1821;
            border: 1px solid #243440;
            border-radius: 10px;
        }

        h1 {
            margin: 0 0 10px;
            color: #22c7f0;
            font-size: 26px;
        }

        .subtitle {
            margin-bottom: 25px;
            color: #9baab5;
            font-size: 14px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #c9d3dc;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #33404b;
            border-radius: 6px;
            background: #071018;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #22c7f0;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #22c7f0;
            color: #041018;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            font-size: 13px;
            line-height: 1.5;
        }

        .back-login {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #22c7f0;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="forgot-container">

    <h1>Reset Password</h1>

    <div class="subtitle">
        Enter your registered email address and we'll send you
        a secure password reset link.
    </div>

    <form id="forgotForm">

        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit" id="resetButton">
            Send Reset Link
        </button>

    </form>

    <div id="message"></div>

    <a href="login.html" class="back-login">
        ← Back to Login
    </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>

<script>

document
    .getElementById("forgotForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const button =
            document.getElementById("resetButton");

        const message =
            document.getElementById("message");

        button.disabled = true;
        button.textContent = "Sending...";

        message.textContent = "";

        try {

            const { error } =
const resetRedirectURL =
    window.location.hostname === "harsh-hirdhani.github.io"
        ? "https://harsh-hirdhani.github.io/guardd/reset-password.html"
        : new URL("reset-password.html", window.location.href).href;

const { error } =
    await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
            redirectTo: resetRedirectURL
        }
    );

if (error) {
    throw error;
}

            if (error) {
                throw error;
            }

            message.style.color = "#22c7f0";

            message.textContent =
                "If this email is registered, a password reset link has been sent. Check your inbox.";

            button.textContent = "Email Sent";

        } catch (error) {

            console.error(error);

            message.style.color = "#ff6b6b";

            message.textContent =
                error.message ||
                "Unable to send reset email.";

            button.disabled = false;
            button.textContent = "Send Reset Link";
        }

    });

</script>

</body>
</html>
