<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | CyberGuard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #071018;
            color: #e8f0f5;
            font-family: Arial, sans-serif;
        }

        .forgot-container {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: #0d1821;
            border: 1px solid #243440;
            border-radius: 10px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin: 0 0 10px;
            color: #22c7f0;
            font-size: 26px;
        }

        .subtitle {
            margin-bottom: 25px;
            color: #9baab5;
            font-size: 14px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #c9d3dc;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #33404b;
            border-radius: 6px;
            background: #071018;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #22c7f0;
            box-shadow: 0 0 0 2px rgba(34, 199, 240, 0.12);
        }

        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 6px;
            background: #22c7f0;
            color: #041018;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover:not(:disabled) {
            background: #63dcfa;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        #message.success {
            display: block;
            color: #8df5bd;
            background: rgba(35, 197, 94, 0.1);
            border: 1px solid rgba(35, 197, 94, 0.3);
        }

        #message.error {
            display: block;
            color: #ff9292;
            background: rgba(255, 80, 80, 0.1);
            border: 1px solid rgba(255, 80, 80, 0.3);
        }

        .back-login {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #22c7f0;
            text-decoration: none;
            font-size: 13px;
        }

        .back-login:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="forgot-container">

        <h1>Reset Password</h1>

        <div class="subtitle">
            Forgot your password? Enter your registered email address
            and we will send you a secure password reset link.
        </div>

        <form id="forgotForm">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                autocomplete="email"
                required
            >

            <button type="submit" id="resetButton">
                Send Reset Link
            </button>

        </form>

        <div id="message" role="status" aria-live="polite"></div>

        <a href="login.html" class="back-login">
            &larr; Back to Login
        </a>

    </div>

    <!-- Supabase library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Your existing Supabase configuration -->
    <script src="supabase-config.js"></script>

    <!-- Your existing authentication file -->
    <script src="auth.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const forgotForm = document.getElementById("forgotForm");
            const emailInput = document.getElementById("email");
            const resetButton = document.getElementById("resetButton");
            const message = document.getElementById("message");

            function showMessage(text, type) {
                message.textContent = text;
                message.className = type;
            }

            forgotForm.addEventListener("submit", async function (event) {

                event.preventDefault();

                const email = emailInput.value.trim();

                if (!email) {
                    showMessage("Please enter your registered email address.", "error");
                    return;
                }

                if (
                    typeof supabaseClient === "undefined" ||
                    !supabaseClient ||
                    !supabaseClient.auth
                ) {
                    console.error("Supabase client is not available.");

                    showMessage(
                        "Authentication could not be initialized. Please check your Supabase configuration.",
                        "error"
                    );

                    return;
                }

                resetButton.disabled = true;
                resetButton.textContent = "Sending...";
                message.className = "";
                message.textContent = "";

                try {

                    /*
                     * Select the appropriate reset page URL.
                     * GitHub Pages uses /guardd/.
                     * Local testing uses the current folder.
                     */

                    let resetRedirectURL;

                    if (
                        window.location.hostname === "harsh-hirdhani.github.io"
                    ) {
                        resetRedirectURL =
                            "https://harsh-hirdhani.github.io/guardd/reset-password.html";
                    } else {
                        resetRedirectURL = new URL(
                            "reset-password.html",
                            window.location.href
                        ).href;
                    }

                    console.log("Password reset redirect:", resetRedirectURL);

                    const { error } =
                        await supabaseClient.auth.resetPasswordForEmail(
                            email,
                            {
                                redirectTo: resetRedirectURL
                            }
                        );

                    if (error) {
                        throw error;
                    }

                    showMessage(
                        "If this email is registered, a password reset link has been sent. Please check your inbox and spam folder.",
                        "success"
                    );

                    resetButton.textContent = "Request Submitted";

                } catch (error) {

                    console.error("Password reset error:", error);

                    showMessage(
                        error.message ||
                        "Unable to send the password reset email. Please try again.",
                        "error"
                    );

                    resetButton.disabled = false;
                    resetButton.textContent = "Send Reset Link";

                }

            });

        });
    </script>

</body>
</html>
