<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set New Password | CyberGuard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #071018;
            color: #e8f0f5;
            font-family: Arial, sans-serif;
        }

        .reset-container {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: #0d1821;
            border: 1px solid #243440;
            border-radius: 10px;
        }

        h1 {
            margin: 0 0 10px;
            color: #22c7f0;
            font-size: 26px;
        }

        .subtitle {
            margin-bottom: 25px;
            color: #9baab5;
            font-size: 14px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #c9d3dc;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #33404b;
            border-radius: 6px;
            background: #071018;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #22c7f0;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #22c7f0;
            color: #041018;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="reset-container">

    <h1>Set New Password</h1>

    <div class="subtitle">
        Create a new secure password for your CyberGuard account.
    </div>

    <form id="resetForm">

        <label for="password">New Password</label>

        <input
            type="password"
            id="password"
            minlength="8"
            placeholder="Enter new password"
            required
        >

        <label for="confirmPassword">
            Confirm New Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            minlength="8"
            placeholder="Confirm new password"
            required
        >

        <button type="submit" id="updateButton">
            Update Password
        </button>

    </form>

    <div id="message"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>

<script>

document
    .getElementById("resetForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const button =
            document.getElementById("updateButton");

        const message =
            document.getElementById("message");

        if (password !== confirmPassword) {

            message.style.color = "#ff6b6b";

            message.textContent =
                "Passwords do not match.";

            return;
        }

        if (password.length < 8) {

            message.style.color = "#ff6b6b";

            message.textContent =
                "Password must be at least 8 characters.";

            return;
        }

        button.disabled = true;
        button.textContent = "Updating...";

        try {

            const { error } =
                await supabaseClient.auth.updateUser({
                    password: password
                });

            if (error) {
                throw error;
            }

            message.style.color = "#22c7f0";

            message.textContent =
                "Password updated successfully. Redirecting to login...";

            setTimeout(function() {

                window.location.href = "login.html";

            }, 2000);

        } catch (error) {

            console.error(error);

            message.style.color = "#ff6b6b";

            message.textContent =
                error.message ||
                "Unable to update password.";

            button.disabled = false;
            button.textContent = "Update Password";
        }

    });

</script>

</body>
</html>
