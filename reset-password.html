<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | CyberGuard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #071018;
            color: #e8f0f5;
            font-family: Arial, sans-serif;
        }

        .reset-container {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: #0d1821;
            border: 1px solid #243440;
            border-radius: 10px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin: 0 0 10px;
            color: #22c7f0;
            font-size: 26px;
        }

        .subtitle {
            margin-bottom: 25px;
            color: #9baab5;
            font-size: 14px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #c9d3dc;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #33404b;
            border-radius: 6px;
            background: #071018;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #22c7f0;
            box-shadow: 0 0 0 2px rgba(34, 199, 240, 0.12);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #22c7f0;
            color: #041018;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover:not(:disabled) {
            background: #63dcfa;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        #message.success {
            display: block;
            color: #8df5bd;
            background: rgba(35, 197, 94, 0.1);
            border: 1px solid rgba(35, 197, 94, 0.3);
        }

        #message.error {
            display: block;
            color: #ff9292;
            background: rgba(255, 80, 80, 0.1);
            border: 1px solid rgba(255, 80, 80, 0.3);
        }

        .back-login {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #22c7f0;
            text-decoration: none;
            font-size: 13px;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        .password-hint {
            margin-top: -10px;
            margin-bottom: 18px;
            color: #9baab5;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="reset-container">

        <h1>Set New Password</h1>

        <div class="subtitle">
            Create a new password for your CyberGuard account.
            Enter it twice to confirm.
        </div>

        <form id="resetForm">

            <label for="password">New Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter new password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <div class="password-hint">
                Use at least 8 characters.
            </div>

            <label for="confirmPassword">Confirm New Password</label>

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Enter password again"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="updateButton">
                Update Password
            </button>

        </form>

        <div id="message" role="status" aria-live="polite"></div>

        <a href="login.html" class="back-login">
            &larr; Back to Login
        </a>

    </div>

    <!-- Supabase library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Existing project configuration -->
    <script src="supabase-config.js"></script>

    <!-- Existing authentication helpers -->
    <script src="auth.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const resetForm = document.getElementById("resetForm");
            const passwordInput = document.getElementById("password");
            const confirmPasswordInput =
                document.getElementById("confirmPassword");
            const updateButton = document.getElementById("updateButton");
            const message = document.getElementById("message");

            function showMessage(text, type) {
                message.textContent = text;
                message.className = type;
            }

            /*
             * Supabase password recovery links may return authentication
             * information in the URL fragment. The Supabase client reads
             * that fragment and establishes the recovery session.
             */

            resetForm.addEventListener("submit", async function (event) {

                event.preventDefault();

                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                if (password.length < 8) {
                    showMessage(
                        "Your password must contain at least 8 characters.",
                        "error"
                    );
                    return;
                }

                if (password !== confirmPassword) {
                    showMessage(
                        "The passwords do not match. Please try again.",
                        "error"
                    );
                    return;
                }

                if (
                    typeof supabaseClient === "undefined" ||
                    !supabaseClient ||
                    !supabaseClient.auth
                ) {
                    showMessage(
                        "Authentication could not be initialized. Please check your Supabase configuration.",
                        "error"
                    );
                    return;
                }

                updateButton.disabled = true;
                updateButton.textContent = "Updating...";
                message.className = "";

                try {

                    /*
                     * First check whether Supabase has an authenticated
                     * recovery session for this password reset.
                     */

                    const { data: sessionData, error: sessionError } =
                        await supabaseClient.auth.getSession();

                    if (sessionError) {
                        throw sessionError;
                    }

                    if (!sessionData.session) {
                        throw new Error(
                            "Your password reset session is missing or expired. Please request a new reset link from the Forgot Password page."
                        );
                    }

                    /*
                     * Update the password for the authenticated user.
                     */

                    const { error: updateError } =
                        await supabaseClient.auth.updateUser({
                            password: password
                        });

                    if (updateError) {
                        throw updateError;
                    }

                    showMessage(
                        "Your password has been updated successfully. You can now sign in with your new password.",
                        "success"
                    );

                    resetForm.reset();
                    updateButton.textContent = "Password Updated";

                    /*
                     * Sign out the recovery session, then return to login.
                     */

                    await supabaseClient.auth.signOut();

                    setTimeout(function () {
                        window.location.href = "login.html";
                    }, 2500);

                } catch (error) {

                    console.error("Password update error:", error);

                    showMessage(
                        error.message ||
                        "Unable to update your password. Please request a new reset link.",
                        "error"
                    );

                    updateButton.disabled = false;
                    updateButton.textContent = "Update Password";

                }

            });

        });
    </script>

</body>
</html>
